olor" stroke-width="1.7"/><path d="M12 3v4M8 12h.01M16 12h.01M9 16h6M2 11v4m20-4v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button></div></div></div>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* Supabase project settings — public browser key only. Never place a service_role/secret key here. */
const SUPABASE_URL = "https://qhhigvtpvytkuguatqvl.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_DsU8ncMNU-Z6X5wnqWY4yg_uu8oVt2c";

const $ = id => document.getElementById(id);
$("year").textContent = new Date().getFullYear();
let callMode = "video", supabaseClient = null, channel = null, pc = null, localStream = null, isHost = false;
let peerId = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36));
let roomCode = "", remotePeerId = null, queuedCandidates = [], isLeaving = false, offerSentTo = null;
let callStartedAt = 0, timerInterval = null, audioContext = null, voiceSource = null, voiceFilters = [], voiceDistortion = null, processedStream = null, activeVoice = "normal";
const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

function setStatus(message, type="") { $("status").textContent = message; $("status").className = "status " + type; }
function setCallNote(message) { $("callNote").textContent = message; }
function setMode(mode) {
  callMode = mode;
  $("videoMode").classList.toggle("active", mode === "video");
  $("audioMode").classList.toggle("active", mode === "audio");
  $("videoMode").setAttribute("aria-pressed", String(mode === "video"));
  $("audioMode").setAttribute("aria-pressed", String(mode === "audio"));
}

function ensureSupabase() {
  if (!window.supabase) throw new Error("Connection library failed to load. Check your internet and refresh.");
  if (!supabaseClient) supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    realtime: { params: { eventsPerSecond: 20 } }
  });
}
function makeRoomCode() {
  const prefixes = ["khati", "khatereh", "khatmin", "minak"];
  const prefix = prefixes[Math.floor(Math.random() * prefixes.length)];
  return prefix + String(Math.floor(Math.random() * 1000)).padStart(3, "0");
}
function cleanCode(value) { return value.toLowerCase().replace(/[^a-z0-9]/g, "").slice(0,12); }
function validRoomCode(value) { return /^(khati|khatereh|khatmin|minak)\d{3}$/.test(value); }
$("roomInput").addEventListener("input", e => { e.target.value = cleanCode(e.target.value); });
$("roomInput").addEventListener("keydown", e => { if (e.key === "Enter") joinRoom(); });

async function startRoom(createNew) {
  if (channel || localStream || pc) await cleanup(false);
  isLeaving = false; isHost = createNew; remotePeerId = null; queuedCandidates = []; offerSentTo = null;
  try {
    ensureSupabase();
    roomCode = createNew ? makeRoomCode() : cleanCode($("roomInput").value);
    if (!createNew && !validRoomCode(roomCode)) throw new Error("Enter a valid room code, such as khatmin123.");
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("This browser needs camera/microphone support. Open the site over HTTPS.");
    setStatus("Requesting microphone access…");
    const mediaConstraints = {
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      video: callMode === "video" ? { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 24, max: 30 } } : false
    };
    localStream = await navigator.mediaDevices.getUserMedia(mediaConstraints);
    await setupVoiceProcessor();
    setVoiceEffect("normal");
    $("localVideo").srcObject = localStream;
    $("localVideo").muted = true;
    $("localPlaceholder").style.display = callMode === "video" ? "none" : "flex";
    if (callMode === "audio") { $("localPlaceholder").querySelector(".big-avatar").textContent = "✦"; $("remotePlaceholder").querySelector(".big-avatar").textContent = "◌"; $("localPlaceholder").querySelector("span").textContent = ""; $("remotePlaceholder").querySelector("span").textContent = ""; }
    $("localVideo").style.display = callMode === "video" ? "block" : "none"; $("remoteVideo").style.display = callMode === "video" ? "block" : "none";
    $("camBtn").style.display = callMode === "video" ? "flex" : "none";
    $("shownCode").textContent = roomCode;
    $("localLabel").textContent = ($("nickname").value.trim() || "You").slice(0,28);
    document.body.classList.add("call-active");
    $("entry").style.display = "none";
    $("call").style.display = "block";
    callStartedAt = Date.now();
    clearInterval(timerInterval);
    timerInterval = setInterval(() => { const seconds = Math.floor((Date.now()-callStartedAt)/1000); const h=String(Math.floor(seconds/3600)).padStart(2,"0"), m=String(Math.floor(seconds%3600/60)).padStart(2,"0"), sec=String(seconds%60).padStart(2,"0"); $("callTimer").textContent = `${h}:${m}:${sec}`; },1000);
    $("chatLog").innerHTML = "";
    setCallNote("Room ready. Share the code with your guest.");
    pc = new RTCPeerConnection(rtcConfig);
    localStream.getTracks().forEach(track => { if(track.kind === "audio" && audioContext && audioContext.state === "running" && window._khatminProcessedAudioTrack && window._khatminProcessedAudioTrack.readyState === "live") pc.addTrack(window._khatminProcessedAudioTrack, new MediaStream([window._khatminProcessedAudioTrack])); else pc.addTrack(track, localStream); });
    pc.ontrack = event => {
      // Keep incoming audio on a dedicated, unmuted audio element. The video element is muted
      // to prevent echo, and is never responsible for playing the guest's voice.
      if (event.track.kind === "audio") {
        const incomingAudio = new MediaStream([event.track]);
        $("remoteAudio").srcObject = incomingAudio;
        $("remoteAudio").muted = false;
        $("remoteAudio").volume = 1;
        event.track.onunmute = () => $("remoteAudio").play().catch(() => {});
        $("remoteAudio").play().catch(() => setCallNote("Tap the page once to enable audio playback."));
      } else if (event.track.kind === "video") {
        const videoStream = new MediaStream([event.track]);
        $("remoteVideo").srcObject = videoStream;
        $("remoteVideo").muted = true;
        if (callMode === "video") $("remotePlaceholder").style.display = "none";
        $("remoteVideo").play().catch(() => {});
      }
      setCallNote("Media received from your guest.");
    };
    pc.onicecandidate = event => {
      if (event.candidate && channel) sendSignal({ type: "candidate", candidate: event.candidate.toJSON(), target: remotePeerId });
    };
    pc.onconnectionstatechange = () => {
      if (!pc) return;
      const state = pc.connectionState;
      if (state === "connected") setCallNote("Connected. Enjoy your call!");
      else if (state === "connecting") setCallNote("Establishing live connection…");
      else if (state === "disconnected") setCallNote("Connection interrupted. Reconnecting…");
      else if (state === "failed") setCallNote("Direct connection failed. This network may require a TURN server.");
    };
    channel = supabaseClient.channel("khatmin-meet-" + roomCode, {
      config: { broadcast: { self: false, ack: true } }
    });
    channel.on("broadcast", { event: "signal" }, async ({ payload }) => {
      try { await handleSignal(payload); }
      catch (err) { console.error("Signaling error:", err); setCallNote("Signaling failed. Please rejoin the room."); }
    });
    await new Promise((resolve, reject) => {
      let settled = false;
      const timeout = setTimeout(() => { if (!settled) { settled = true; reject(new Error("Supabase connection timed out. Check your internet and project settings.")); } }, 16000);
      channel.subscribe((state, err) => {
        if (state === "SUBSCRIBED" && !settled) { settled = true; clearTimeout(timeout); resolve(); }
        else if (["CHANNEL_ERROR","TIMED_OUT","CLOSED"].includes(state) && !settled) {
          settled = true; clearTimeout(timeout);
          const detail = err && (err.message || err.reason || String(err));
          console.error("Supabase Realtime subscription failed:", state, err || "no error detail");
          reject(new Error("Realtime: " + state + (detail ? " — " + detail : "") + " | Check your project URL/key and WebSocket connection."));
        }
      });
    });
    await sendSignal({ type: "join", name: ($("nickname").value.trim() || (createNew ? "Host" : "Guest")).slice(0,28) });
    setStatus("Room is ready.", "ok");
    setCallNote("Waiting for your guest to join…");
  } catch (err) {
    console.error(err);
    let message = err && err.name === "NotAllowedError" ? "Microphone or camera permission was denied. Check your browser permissions." : (err.message || "An unexpected error occurred.");
    setStatus(message, "error");
    if ($("call").style.display === "block") { document.body.classList.remove("call-active"); $("call").style.display = "none"; $("entry").style.display = "block"; }
    await cleanup(false);
  }
}
async function sendSignal(data) {
  if (!channel) return;
  const { error } = await channel.send({ type: "broadcast", event: "signal", payload: { ...data, from: peerId, room: roomCode } });
  if (error) throw error;
}
async function handleSignal(payload) {
  if (!payload || payload.from === peerId || payload.room !== roomCode || (payload.target && payload.target !== peerId)) return;
  if (payload.type === "join") {
    remotePeerId = payload.from;
    $("remoteLabel").textContent = (payload.name || "Guest").slice(0,28);
    $("remoteWaiting").textContent = "Guest joined";
    setCallNote("Guest joined. Connecting…");
    /* Deterministic offerer prevents both browsers from making offers simultaneously. */
    if (isHost && offerSentTo !== remotePeerId) await makeOffer(remotePeerId);
    return;
  }
  if (payload.type === "offer") {
    remotePeerId = payload.from;
    $("remoteLabel").textContent = "Guest";
    await pc.setRemoteDescription(new RTCSessionDescription(payload.description));
    await flushCandidates();
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await sendSignal({ type: "answer", description: pc.localDescription, target: remotePeerId });
    return;
  }
  if (payload.type === "answer") {
    if (offerSentTo && payload.from !== offerSentTo) return;
    remotePeerId = payload.from;
    if (pc.signalingState === "have-local-offer") {
      await pc.setRemoteDescription(new RTCSessionDescription(payload.description));
      await flushCandidates();
    }
    return;
  }
  if (payload.type === "candidate") {
    if (remotePeerId && payload.from !== remotePeerId) return;
    if (!remotePeerId) remotePeerId = payload.from;
    if (pc.remoteDescription && pc.remoteDescription.type) {
      try { await pc.addIceCandidate(new RTCIceCandidate(payload.candidate)); }
      catch (err) { console.warn("ICE candidate rejected:", err); }
    } else queuedCandidates.push(payload.candidate);
    return;
  }
  if (payload.type === "chat") {
    addChatMessage(payload.text, false, payload.name || "Guest", payload.time || Date.now());
    $("chatModal").classList.add("open"); $("chatModal").setAttribute("aria-hidden","false");
    return;
  }
  if (payload.type === "reaction") { burstReaction(payload.emoji, true); return; }
  if (payload.type === "bye") {
    $("remoteVideo").srcObject = null;
    $("remotePlaceholder").style.display = "flex";
    $("remoteWaiting").textContent = "Guest left the room";
    setCallNote("Your guest left the call.");
  }
}
async function makeOffer(target) {
  if (!pc || isLeaving || offerSentTo === target) return;
  try {
    offerSentTo = target;
    remotePeerId = target;
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await sendSignal({ type: "offer", description: pc.localDescription, target });
    setCallNote("Connecting your call…");
  } catch (err) {
    offerSentTo = null;
    console.error(err);
    setCallNote("Could not connect. Please rejoin the room.");
  }
}
async function flushCandidates() {
  const candidates = queuedCandidates;
  queuedCandidates = [];
  for (const candidate of candidates) {
    try { await pc.addIceCandidate(new RTCIceCandidate(candidate)); }
    catch (err) { console.warn("Queued ICE candidate rejected:", err); }
  }
}
function joinRoom() { startRoom(false); }
$("createBtn").addEventListener("click", () => startRoom(true));
$("joinBtn").addEventListener("click", joinRoom);
$("copyBtn").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(roomCode);
    $("copyBtn").style.color = "#a8efd1";
    setTimeout(() => { $("copyBtn").style.color = ""; }, 1200);
  } catch {
    setCallNote("Clipboard is unavailable. Room code: " + roomCode);
  }
});
$("micBtn").addEventListener("click", () => {
  if (!localStream) return;
  const track = localStream.getAudioTracks()[0];
  if (!track) return;
  track.enabled = !track.enabled;
  $("micBtn").classList.toggle("off", !track.enabled);

$("camBtn").addEventListener("click", () => {
  if (!localStream) return;
  const track = localStream.getVideoTracks()[0];
  if (!track) return;
  track.enabled = !track.enabled;
  $("camBtn").classList.toggle("off", !track.enabled);
  $("camBtn").querySelector("span").textContent = track.enabled ? "Camera" : "Camera off";
});
function burstReaction(emoji, remote=false) {
  const layer = $("reactionLayer");
  const count = 7;
  for (let i=0;i<count;i++) {

    el.style.left=(8+Math.random()*84)+"%";

  }
}
$("messageBtn").addEventListener("click",()=>{ $("chatModal").classList.add("open"); $("chatModal").setAttribute("aria-hidden","false"); setTimeout(()=>$ ("chatInput").focus(),80); });
$("closeChatBtn").addEventListener("click",()=>{ $("chatModal").classList.remove("open"); $("chatModal").setAttribute("aria-hidden","true"); });
$("chatModal").addEventListener("click",e=>{if(e.target===$("chatModal")){ $("chatModal").classList.remove("open"); $("chatModal").setAttribute("aria-hidden","true"); }});

  const emoji=btn.dataset.emoji; burstReaction(emoji,false); $("reactionMenu").classList.remove("open");

function addChatMessage(message, mine, name, time) {
  const bubble = document.createElement("div"); bubble.className = "chat-bubble" + (mine ? " mine" : "");
  bubble.textContent = message;
  const meta = document.createElement("span"); meta.className = "chat-time"; meta.textContent = `${name} · ${new Date(time).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}`;
  bubble.appendChild(meta); $("chatLog").appendChild(bubble); $("chatLog").scrollTop = $("chatLog").scrollHeight;
}
$("chatForm").addEventListener("submit", async e => {
  e.preventDefault(); const text = $("chatInput").value.trim(); if (!text || !channel) return;
  const now = Date.now(); addChatMessage(text, true, $("nickname").value.trim() || "You", now); $("chatInput").value = ""; $("chatModal").classList.add("open"); $("chatModal").setAttribute("aria-hidden","false");
  try { await sendSignal({type:"chat", text, name:($("nickname").value.trim() || "Guest").slice(0,28), time:now, target:remotePeerId}); }
  catch(err) { setCallNote("Message could not be sent. Check the connection."); }
});
async function setupVoiceProcessor() {
  // Always create a live output track with a dry bypass. The microphone remains audible
  // even if a browser cannot run an effect or the selected preset is Original.
  try {
    if (!localStream || !localStream.getAudioTracks().length) return;
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    audioContext = new AudioCtx();
    voiceSource = audioContext.createMediaStreamSource(new MediaStream([localStream.getAudioTracks()[0]]));
    const dryGain = audioContext.createGain();
    const low = audioContext.createBiquadFilter(); low.type = "lowshelf"; low.frequency.value = 180;
    const high = audioContext.createBiquadFilter(); high.type = "highshelf"; high.frequency.value = 2800;
    const peak = audioContext.createBiquadFilter(); peak.type = "peaking"; peak.frequency.value = 1200; peak.Q.value = 0.8;
    const distortion = audioContext.createWaveShaper(); distortion.oversample = "4x"; distortion.curve = makeDistortionCurve(18);
    const wetGain = audioContext.createGain();
    processedStream = audioContext.createMediaStreamDestination();
    voiceSource.connect(dryGain); dryGain.connect(processedStream);
    voiceSource.connect(low); low.connect(peak); peak.connect(high); high.connect(distortion); distortion.connect(wetGain); wetGain.connect(processedStream);
    window._khatminVoiceNodes = {low, high, peak, distortion, dryGain, wetGain};
    await audioContext.resume();
    const outputTrack = processedStream.stream.getAudioTracks()[0];
    window._khatminProcessedAudioTrack = outputTrack && outputTrack.readyState === "live" ? outputTrack : null;
    setVoiceEffect(activeVoice || "normal");
  } catch (err) {
    console.warn("Voice effects unavailable; original microphone will be sent:", err);
    window._khatminProcessedAudioTrack = null;
  }
}
function setVoiceEffect(mode) {
  activeVoice = mode;
  const presets = {
    normal:{low:0,high:0,peak:0,robot:false,dry:1,wet:0},
    woman:{low:-3,high:5,peak:2,robot:false,dry:.18,wet:.82},
    man:{low:5,high:-2,peak:-2,robot:false,dry:.18,wet:.82},
    child:{low:-2,high:7,peak:4,robot:false,dry:.15,wet:.85},
    robot:{low:2,high:3,peak:7,robot:true,dry:.12,wet:.88}
  };
  const preset = presets[mode] || presets.normal;
  if (audioContext && audioContext.state !== "closed" && window._khatminVoiceNodes) {
    const n = window._khatminVoiceNodes, now = audioContext.currentTime;
    n.low.gain.setTargetAtTime(preset.low, now, .04);
    n.high.gain.setTargetAtTime(preset.high, now, .04);
    n.peak.gain.setTargetAtTime(preset.peak, now, .04);
    n.dryGain.gain.setTargetAtTime(preset.dry, now, .04);
    n.wetGain.gain.setTargetAtTime(preset.wet, now, .04);
    n.distortion.curve = preset.robot ? makeDistortionCurve(95) : makeDistortionCurve(4);
  }
  document.querySelectorAll(".voice-option").forEach(b => b.classList.toggle("active", b.dataset.voice === mode));
}
function makeDistortionCurve(amount) {
  const n = 44100, curve = new Float32Array(n), k = amount;
  for (let i=0;i<n;i++) { const x = i*2/n-1; curve[i] = ((3+k)*x*20*(Math.PI/180))/(Math.PI+k*Math.abs(x)); }
  return curve;
}
$("voiceBtn").addEventListener("click",()=>$("voiceMenu").classList.toggle("open"));
document.querySelectorAll(".voice-option").forEach(b=>b.addEventListener("click",()=>{setVoiceEffect(b.dataset.voice);$("voiceMenu").classList.remove("open");}));
async function cleanup(sendBye=true) {
  isLeaving = true;
  clearInterval(timerInterval); timerInterval=null; callStartedAt=0; $("callTimer").textContent="00:00:00";
  if(audioContext && audioContext.state !== "closed"){try{await audioContext.close();}catch(e){}} audioContext=null; voiceSource=null; processedStream=null; window._khatminProcessedAudioTrack=null; window._khatminVoiceNodes=null;
  $("voiceMenu").classList.remove("open"); setVoiceEffect("normal");
  if (sendBye && channel) { try { await sendSignal({ type: "bye", target: remotePeerId }); } catch (err) {} }
  const oldChannel = channel;
  channel = null;
  if (oldChannel && supabaseClient) { try { await supabaseClient.removeChannel(oldChannel); } catch (err) {} }
  if (pc) { try { pc.ontrack = null; pc.onicecandidate = null; pc.close(); } catch (err) {} }
  pc = null;
  if (localStream) localStream.getTracks().forEach(track => track.stop());
  localStream = null;
  $("localVideo").srcObject = null; $("remoteVideo").srcObject = null; $("remoteAudio").srcObject = null;
  $("chatModal").classList.remove("open"); $("chatModal").setAttribute("aria-hidden","true"); $("reactionMenu").classList.remove("open");
  $("localPlaceholder").style.display = "flex"; $("remotePlaceholder").style.display = "flex";
  $("remoteWaiting").textContent = "Waiting for guest…";
  $("micBtn").classList.remove("off"); $("camBtn").classList.remove("off");
  $("micBtn").querySelector("span").textContent = "Mic";
  $("camBtn").querySelector("span").textContent = "Camera";
  remotePeerId = null; queuedCandidates = []; offerSentTo = null;
}
async function leaveCall() {
  await cleanup(true);
  document.body.classList.remove("call-active");
  $("call").style.display = "none"; $("entry").style.display = "block";
  setStatus("Call ended. Create a new room or join with a code.");
}

  if (localStream) localStream.getTracks().forEach(track => track.stop());
});
